name: Update ticker master

# [매달 1일 자동 갱신] KIS 종목 마스터(국내 코스피/코스닥 + 해외 나스닥/뉴욕/아멕스)를 새로 받아
# data/ticker-master.json을 갱신하고 커밋한다. 앱은 이 파일을 jsDelivr CDN 경유로 fetch해서 종목
# 검색에 쓴다(js/09-price-fx-risk-engine.js의 loadTickerMaster() 참고).
#
# [I-11 · PM 결정 D-1 · 2026-09-20] 이 파일은 종목 검색만이 아니라 **Risk Benchmark 판정**에도 쓰인다
# (js/09 resolveRiskBenchmark ③ - 상장 거래소 · 종목명). 그래서 새 마스터를 바로 덮어쓰지 않고
# 임시 파일로 먼저 만든 뒤 Diff Gate(scripts/ticker-master-diff-gate.js)가 변경량을 확인한다.
#   정상 변경 -> 자동 적용 후 커밋
#   이상 변경 -> **마스터를 교체하지 않고 STOP**하고 감사 기록만 커밋한 뒤 작업을 실패로 끝낸다
# 임계값과 감시 대상은 PM이 확정했다(체크리스트 §48 참고). 강제 통과 플래그는 만들지 않는다 -
# 사람이 감사 기록을 확인하고 원인이 해소된 뒤 workflow_dispatch로 다시 실행한다.
#
# workflow_dispatch(수동 실행 - Actions 탭에서 "Run workflow" 버튼)와 repository_dispatch(외부에서
# curl/API로 트리거)도 함께 열어둬서, 정기 스케줄을 기다리지 않고도 언제든 즉시 갱신할 수 있다.
on:
  schedule:
    # 매달 1일 00:00 UTC(=한국시간 오전 9시). GitHub Actions의 스케줄 cron은 UTC 기준.
    - cron: '0 0 1 * *'
  workflow_dispatch: {}
  repository_dispatch:
    types: [update-ticker-master]

permissions:
  contents: write

# [T6 후속 · Issue 3] H.10 환율 갱신(update-fx-h10.yml, 매주 화 00:00 UTC)과 겹칠 수 있어 같은 그룹으로
# 묶는다 - 둘 다 main에 push하므로 동시에 돌면 늦게 끝난 쪽 push가 거부될 수 있다. 진행 중 작업은 취소하지 않는다.
concurrency:
  group: data-update-main-push
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install script dependencies
        run: npm install --no-audit --no-fund

      # 다운로드 · 파싱 · 기존 구조 검증(MIN_SANE_TOTAL_COUNT · 이름 검증 · 코드 형식)은 예전 그대로다.
      # 달라진 것은 결과를 운영 파일이 아니라 임시 파일에 쓴다는 점뿐이다(TICKER_MASTER_OUT).
      - name: Download and parse KIS ticker master (to staging file)
        env:
          TICKER_MASTER_OUT: ${{ runner.temp }}/ticker-master.next.json
        run: node scripts/update-ticker-master.js

      # Diff Gate - 정상이면 스스로 운영 파일 자리로 옮기고 0, 이상이면 교체하지 않고 2로 끝난다.
      # 어느 경우든 docs/closeout/ticker-master-audit.json에 기록을 남긴다.
      - name: Diff Gate (threshold check)
        id: gate
        continue-on-error: true
        run: |
          node scripts/ticker-master-diff-gate.js \
            --current data/ticker-master.json \
            --next "${{ runner.temp }}/ticker-master.next.json" \
            --apply-to data/ticker-master.json \
            --audit docs/closeout/ticker-master-audit.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # STOP이어도 감사 기록은 남겨야 한다(PM 확인 · 대장 연결의 근거다).
      # 마스터 파일은 Diff Gate가 교체하지 않았으므로 이 커밋에 들어가지 않는다.
      - name: Commit audit (and master when applied)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          AUDIT_ID=$(node -e "const d=require('./docs/closeout/ticker-master-audit.json');const e=d.entries[d.entries.length-1];process.stdout.write(e?e.auditId:'none')")
          # 감사 파일은 첫 실행에서 추적되지 않은 상태일 수 있다 - 먼저 stage한 뒤 --cached로 본다
          # (git diff만 보면 새 파일을 변경 없음으로 오판해 감사 기록이 커밋되지 않는다).
          git add data/ticker-master.json docs/closeout/ticker-master-audit.json
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋을 건너뜁니다."
            exit 0
          fi
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            git commit -m "chore: update ticker master data ($(date -u +%Y-%m-%d)) [$AUDIT_ID]"
          else
            git commit -m "chore(audit): ticker master diff gate STOP ($(date -u +%Y-%m-%d)) [$AUDIT_ID]"
          fi
          git push

      # Diff Gate가 STOP이면 여기서 작업을 실패로 끝낸다 - Actions 목록에서 바로 보이게 하기 위함이다.
      - name: Fail the run when the gate stopped
        if: steps.gate.outcome != 'success'
        run: |
          echo "Diff Gate가 STOP했습니다 - data/ticker-master.json은 교체되지 않았습니다."
          echo "docs/closeout/ticker-master-audit.json의 마지막 항목과 위 Diff Gate 로그를 확인하세요."
          exit 1
