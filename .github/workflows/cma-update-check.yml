name: CMA update check

# [체크리스트 §37 CMA-AUTO] 매달 등록된 공식 CMA Source(data/cma/registry.json)를 확인한다.
#   Source → Check(ETag/Last-Modified/hash) → Fetch → Parse → Validate → Diff → 새 Dataset(VERIFIED, 검토 대기)
# 이 작업은 data/cma/(Dataset · Registry · Audit Log)만 커밋한다. 앱이 계산에 쓰는 세트(active.json ·
# js/26-cma-data.js)는 절대 바꾸지 않는다 - PM 승인 후 사람이 `node scripts/cma-update.js approve/activate`로만 바꾼다(자동 ACTIVE 금지).
# 실패(다운로드 · 해석 · 검증)는 audit-log.json에 기록되고 기존 ACTIVE 세트는 그대로 유지된다.
on:
  schedule:
    # 매달 3일 01:00 UTC(한국시간 10시) - 종목 마스터 갱신(매달 1일)과 겹치지 않게 둔다. 분기 · 연간 CMA 모두 월 1회 이상 확인.
    - cron: '0 1 3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: cma-update-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install PDF text tool (pdftotext)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Check official CMA sources
        run: node scripts/cma-update.js check

      - name: Guard - ACTIVE set and app data unchanged
        run: |
          if ! git diff --quiet -- data/cma/active.json js/26-cma-data.js; then
            echo "확인 작업이 ACTIVE 세트나 앱 데이터 파일을 바꿨습니다 - 커밋하지 않고 중단합니다."
            exit 1
          fi

      - name: Commit and push data/cma if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/cma && [ -z "$(git ls-files --others --exclude-standard -- data/cma)" ]; then
            echo "변경 없음 - 커밋을 건너뜁니다."
            exit 0
          fi
          git add -- data/cma/registry.json data/cma/audit-log.json data/cma/datasets
          git commit -m "chore: CMA source check ($(date -u +%Y-%m-%d))"
          git push
